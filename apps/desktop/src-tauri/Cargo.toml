[package]
name = "palor-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "palor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "palor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
palor-core = { path = "../../../crates/palor-core" }
palor-downloads = { path = "../../../crates/palor-downloads" }
palor-docs = { path = "../../../crates/palor-docs" }
palor-runtime = { path = "../../../crates/palor-runtime" }
palor-search = { path = "../../../crates/palor-search" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tar = "0.4"
flate2 = "1.1"
zip = { version = "4.3", default-features = false, features = ["deflate"] }
zstd = "0.13"
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
