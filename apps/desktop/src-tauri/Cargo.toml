[package]
name = "veda-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "veda_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "veda"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
veda-core = { path = "../../../crates/veda-core" }
veda-downloads = { path = "../../../crates/veda-downloads" }
veda-docs = { path = "../../../crates/veda-docs" }
veda-runtime = { path = "../../../crates/veda-runtime" }
veda-search = { path = "../../../crates/veda-search" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tar = "0.4"
flate2 = "1.1"
zip = { version = "4.3", default-features = false, features = ["deflate"] }
zstd = "0.13"
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
