[package]
name = "veda-docpack"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "veda-docpack"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
veda-core = { path = "../../crates/veda-core" }
veda-docs = { path = "../../crates/veda-docs" }
regex = "1.11"
scraper = "0.24"
walkdir = "2.5"

[lints]
workspace = true
