name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test -p palor-core -p palor-downloads -p palor-docs -p palor-search -p palor-runtime -p palor-docpack
      - run: cargo clippy -p palor-core -p palor-downloads -p palor-docs -p palor-search -p palor-runtime -p palor-docpack -- -D warnings
