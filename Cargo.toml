[workspace]
members = [
  "crates/veda-core",
  "crates/veda-downloads",
  "crates/veda-search",
  "crates/veda-runtime",
  "crates/veda-docs",
  "tools/docpack",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Veda contributors"]
rust-version = "1.82"

# Temporary probe: CI clippy logs are unreadable from this sandbox.
# These are warn-by-default lints added after 1.88 (our local clippy).
# If CI goes green, the failure is one of these and we will fix the
# actual site and delete this table.
[workspace.lints.clippy]
uninlined_format_args = "allow"
useless_borrows_in_formatting = "allow"
manual_clear = "allow"
explicit_auto_deref = "allow"
needless_option_as_deref = "allow"
unused_format_specs = "allow"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
futures-util = "0.3"
hex = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
